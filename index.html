<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminators Esports</title>
    <style>
        body {
            background-color: #050508;
            color: #f0f0f5;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
        .nav-tabs {
            display: flex;
            background: #12121c;
            border-radius: 12px;
            padding: 6px;
            gap: 6px;
            max-width: 400px;
            margin: 20px auto;
        }
        .tab-btn {
            flex: 1;
            background: #22223b;
            border: none;
            color: #fff;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #f39c12;
            color: #000;
        }
        .panel {
            background: #0d0d16;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto;
            display: none;
        }
        .panel.active {
            display: block;
        }
    </style>
</head>
<body>

    <h1>Terminators Esports</h1>
    <p>Founder: M I C O</p>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('hub')">Hub</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
        <button class="tab-btn" onclick="switchTab('teams')">Teams</button>
    </div>

    <div id="panel-hub" class="panel active">
        <h2>Hub Panel Content</h2>
        <p>Welcome to the main hub!</p>
    </div>

    <div id="panel-register" class="panel">
        <h2>Register Panel Content</h2>
        <p>Squad registration form goes here.</p>
    </div>

    <div id="panel-teams" class="panel">
        <h2>Teams Panel Content</h2>
        <p>Registered teams list goes here.</p>
    </div>

    <script>
        function switchTab(tabName) {
            // Hide all panels
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            // Deactivate all buttons
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            // Activate target panel and button
            document.getElementById('panel-' + tabName).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
