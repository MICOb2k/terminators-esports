<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminators Esports | Professional Free Fire Hub</title>
    <style>
        :root {
            --bg-deep: #050508;
            --bg-panel: rgba(13, 13, 22, 0.95);
            --accent-gold: #f39c12;
            --accent-gold-glow: rgba(243, 156, 18, 0.3);
            --accent-neon: #00f2fe;
            --accent-red: #ff3366;
            --accent-green: #00e676;
            --text-main: #f0f0f5;
            --text-muted: #8a8aab;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        header {
            width: 100%;
            max-width: 650px;
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 4px;
        }

        .founder-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .founder-tag span {
            color: var(--accent-neon);
        }

        .status-bar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .nav-tabs {
            display: flex;
            background: rgba(18, 18, 30, 0.9);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 650px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 14px 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-gold), #d68910);
            color: #050508;
            box-shadow: 0 4px 15px var(--accent-gold-glow);
        }

        .wrapper {
            width: 100%;
            max-width: 650px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            border-left: 4px solid var(--accent-gold);
            padding-left: 10px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .social-card {
            background: rgba(12, 12, 20, 0.7);
            border: 1px solid var(--border-glass);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
        }

        .gaming-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(8, 8, 14, 0.9);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
        }

        .action-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--accent-gold), #d68910);
            color: #050508;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
        }

        footer {
            margin-top: 25px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="status-bar">Tournament Engine Online</div>
        <div class="brand-logo">Terminators Esports</div>
        <div class="founder-tag">Founder: <span>M I C O</span></div>
    </header>

    <div class="wrapper">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('hub')">Hub</button>
            <button class="tab-btn" onclick="switchTab('register')">Register</button>
            <button class="tab-btn" onclick="switchTab('teams')">Teams</button>
            <button class="tab-btn" onclick="switchTab('admin')">Admin</button>
        </div>
    </div>

    <div class="wrapper">
        <div id="tab-hub" class="tab-content active">
            <div class="panel">
                <div class="panel-title">Community Hub</div>
                <div class="social-grid">
                    <a href="#" class="social-card">✈️ Telegram</a>
                    <a href="#" class="social-card">🎮 Discord</a>
                </div>
            </div>
        </div>

        <div id="tab-register" class="tab-content">
            <div class="panel">
                <div class="panel-title">Squad Registration</div>
                <input type="text" placeholder="Squad Name" class="gaming-input">
                <input type="text" placeholder="Leader IGN" class="gaming-input">
                <button class="action-btn">Register Squad</button>
            </div>
        </div>

        <div id="tab-teams" class="tab-content">
            <div class="panel">
                <div class="panel-title">Registered Teams</div>
                <p style="color:var(--text-muted); font-size:13px;">No teams registered yet.</p>
            </div>
        </div>

        <div id="tab-admin" class="tab-content">
            <div class="panel">
                <div class="panel-title">Admin Console</div>
                <input type="password" placeholder="Passcode" class="gaming-input">
                <button class="action-btn" style="background:var(--accent-red); color:#fff;">Unlock</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Terminators Esports. Founded by M I C O.
    </footer>

    <script>
        function switchTab(tabId) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            // Remove active style from all buttons
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active');
            });
            
            // Show target tab
            const target = document.getElementById('tab-id-' + tabId) || document.getElementById('tab-' + tabId);
            if (target) {
                target.classList.add('active');
            }
            
            // Highlight clicked button
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
