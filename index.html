    <!-- Combined Module Scri<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminators Esports - Registration</title>
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 10px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        input { background: #334155; color: white; }
        button { background: #e11d48; color: white; font-weight: bold; cursor: pointer; }
        .team-card { background: #334155; padding: 10px; margin: 10px 0; border-radius: 5px; text-align: left; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔥 Terminators Esports Tournament 🔥</h2>
        
        <!-- Registration Form -->
        <form id="regForm">
            <input type="text" id="teamName" placeholder="Team Name (e.g., Terminator Squad)" required>
            <input type="text" id="leaderName" placeholder="Leader In-Game Name (IGN)" required>
            <button type="submit">Register Squad</button>
        </form>

        <h3>📋 Publicly Registered Teams</h3>
        <div id="teamsContainer">Loading teams...</div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyB4nLlRgIbYL6vxmyw5V8D1F3_Fixtfc5w",
          authDomain: "terminators-esports.firebaseapp.com",
          projectId: "terminators-esports",
          storageBucket: "terminators-esports.firebasestorage.app",
          messagingSenderId: "737418872311",
          appId: "1:737418872311:web:bf1be1b7932b271fb91af2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Save Team to Firestore when form is submitted
        const form = document.getElementById("regForm");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const teamName = document.getElementById("teamName").value;
            const leaderName = document.getElementById("leaderName").value;

            try {
                await addDoc(collection(db, "registeredTeams"), {
                    teamName: teamName,
                    leader: leaderName,
                    time: new Date()
                });
                alert("Squad Registered Successfully!");
                form.reset();
            } catch (err) {
                console.error("Error saving team: ", err);
                alert("Failed to register. Check connection.");
            }
        });

        // Show Registered Teams Live on the page
        const container = document.getElementById("teamsContainer");
        onSnapshot(collection(db, "registeredTeams"), (snapshot) => {
            container.innerHTML = "";
            if (snapshot.empty) {
                container.innerHTML = "<p>No teams registered yet. Be the first!</p>";
                return;
            }
            snapshot.forEach((doc) => {
                const data = doc.data();
                container.innerHTML += `
                    <div class="team-card">
                        <strong>⚔️ ${data.teamName}</strong><br>
                        <small>Leader: ${data.leader}</small>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
